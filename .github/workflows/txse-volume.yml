name: TXSE Daily Volume

on:
  workflow_dispatch:
  schedule:
    - cron: "35 23 * * 1-5"
  push:
    branches: [main]
    paths:
      - "txse_scraper/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/txse-volume.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Backfill TXSE history from live trading launch
        run: python -m txse_scraper.history --start 2026-07-10 --output data/txse_daily.csv
      - name: Generate rolling analysis
        run: python -m txse_scraper.analyze --input data/txse_daily.csv --output reports/latest.md
      - name: Generate weekly evolution table and report
        run: python -m txse_scraper.weekly --input data/txse_daily.csv --csv data/txse_weekly.csv --report reports/weekly_evolution.md
      - name: Generate weekly charts
        run: python -m txse_scraper.charts --input data/txse_weekly.csv --outdir reports/charts
      - name: Commit updated history, reports and charts
        run: |
          if [ -z "$(git status --porcelain -- data/ reports/)" ]; then
            echo "No changed TXSE data or reports."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git commit -m "data: update TXSE history and weekly evolution"
          git pull --rebase origin main
          git push
