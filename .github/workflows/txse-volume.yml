name: TXSE Daily Volume

on:
  workflow_dispatch:
  schedule:
    - cron: "35 23 * * 1-5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill recent TXSE history
        run: python -m txse_scraper.history --output data/txse_daily.csv
      - name: Generate rolling analysis
        run: python -m txse_scraper.analyze --input data/txse_daily.csv --output reports/latest.md
      - name: Commit updated history and report
        run: |
          if git diff --quiet -- data/txse_daily.csv reports/latest.md; then
            echo "No changed TXSE data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/txse_daily.csv reports/latest.md
          git commit -m "data: update TXSE volume and analysis"
          git push
